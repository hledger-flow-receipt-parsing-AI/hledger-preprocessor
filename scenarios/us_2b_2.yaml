# =============================================================================
# Scenario manifest — US-2b.2 "Label a cash receipt"
# Second scenario, added to validate that the harness templates cleanly.
# See scenarios/README.md and scenarios/us_2b_1.yaml for the field reference.
# =============================================================================

id: US-2b.2
title: "Label a cash receipt"
section: "Step 2b: Receipt Labelling"
gif_video: 2b2_full_path

fixtures:
  config_template: 1_bank_1_wallet.yaml
  categories:
    groceries: {ekoplaza: {}, supermarket: {}}
    food: {coffee: {}, restaurant: {}}
    repairs: {bike: {}}
    abonnement:
      monthly: {phone: {}, rent: {}}
  starting_journal: |
    2024/01/01 Opening Balances
        Assets:Checking          €1000.00
        Equity:Opening Balances
  # A wallet (cash) receipt does not match a bank CSV; the CSV is present only
  # so the config validates.
  bank_csv:
    filename: triodos_2025.csv
    header: "date,account_nr,amount,type,payee,counter_account,code,description,balance"
    rows:
      - "15-01-2025,NL79 TRIO 0379 2834 09,-42.17,debit,Ekoplaza,NL456,IC,groceries:ekoplaza,1000.00"
  receipt_label_seed: coffee_cash.json
  receipt_image_stem: coffee_cash

script:
  date: "2025-02-10"
  time: "08:15"
  is_withdrawal: false
  category: "food:coffee"
  account: {bank: wallet, account_type: physical}
  currency: EUR
  amount: "20"
  change: "15"
  add_another_account: false
  shop:
    name: "Koffie Leute"
    street: Oudegracht
    house_nr: "12"
    zipcode: "3511AB"
    city: Utrecht
    country: Netherlands
  subtotal: ""
  total_tax: "0.87"

expect:
  the_date: "2025-02-10T08:15:00"
  receipt_category: "food:coffee"
  # NOTE: the script types "Koffie Leute" but the real run produces
  # "KoffieLeute" — the urwid shop-name field drops the space.  This is a real
  # discovery surfaced by deriving from the actual run (the old fixture-based
  # test hid it).  See scenarios/README.md "Remaining work".
  shop_name: "KoffieLeute"
  account: {bank: wallet, account_type: physical}
  currency: EUR
  total_tax: 0.87

dag:
  segment_nodes: [img_coffee_cash, nolbl_coffee_cash, tui_coffee_cash, lbl_coffee_cash]
  node_bindings:
    img_coffee_cash:
      label: "{image_stem}.jpg"
      desc: "Coffee receipt, paid cash"
    nolbl_coffee_cash:
      label: "{image_stem}\n(no label)"
      desc: "No receipt label JSON exists yet for the {image_stem} receipt"
    lbl_coffee_cash:
      label: "{image_stem}\n{currency} {amount} cash"
      desc: "{account_bank} wallet, {date}, {category}"
    jrnl_coffee_cash:
      label: "Expenses:{category_title}\n{amount} {currency}"
      desc: "Debit {category}, credit {account_bank} wallet"
