account_configs:
  # Bank account with CSV input
  - base_currency: EUR
    account_holder: at
    bank: triodos
    account_type: checking
    input_csv_filename: "triodos_2025.csv"
    csv_column_mapping: [
        ["the_date", "date"],
        ["", ""],
        ["tendered_amount_out", "amount"],
        ["transaction_code", ""],
        ["other_party_name", ""],
        ["other_party_account_name", ""],
        ["", ""],
        ["description", "description"],
        ["", ""],
      ]
    tnx_date_columns: [["the_date", "date"], ["description", "description"]]

  # Bitcoin digital wallet - no CSV, derived from receipts
  - input_csv_filename: null
    base_currency: BTC
    account_holder: at
    bank: wallet
    account_type: digital
    csv_column_mapping: null
    tnx_date_columns: null
