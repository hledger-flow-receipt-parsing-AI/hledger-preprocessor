# =============================================================================
# User Story DAG Data
# =============================================================================
# This file defines all data nodes (grouped by layer) and the paths each
# user story takes through those nodes.  A Python generator script reads
# this file and produces PlantUML (.puml) files.
#
# Layer order (top to bottom in the DAG):
#   1. config        - config.yaml variants
#   2. categories    - categories.yaml variants
#   3. matching_cfg  - matching algorithm parameters
#   4. start_journal - opening-balance journals
#   5. csv_txn       - bank CSV transaction rows
#   6. receipt_img   - receipt photographs
#   7. receipt_lbl   - receipt label JSONs
#   8. matching_out  - matching algorithm outcomes
#   9. journal_out   - hledger journal postings
#  10. visualization - Sankey / Treemap visualisations
# =============================================================================

# -----------------------------------------------------------------------------
# Layer definitions — each node has an id, short label, and long description
# -----------------------------------------------------------------------------
