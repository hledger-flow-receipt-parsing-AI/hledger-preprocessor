# -----------------------------------------------------------------------------
# Edges — directed connections between layers (shared by all stories)
# These define which downstream nodes a given upstream node feeds into.
# Each story then selects a subset of these edges.
# -----------------------------------------------------------------------------
# (Edges are implicitly defined by story paths below — the generator
#  creates edges for each consecutive pair of nodes in a path.)

# -----------------------------------------------------------------------------
# User Story Paths
# -----------------------------------------------------------------------------
# Each story defines one or more paths through the DAG.
# A path is an ordered list of node IDs from top layer to bottom.
# Multiple paths per story = the story touches multiple independent flows.
#
# Fields:
#   id:        user story ID (matches userstories_v0.md)
#   label:     short name for legend
#   colour:    hex colour for edges/highlighting
#   pattern:   line style (solid, dashed, dotted, bold)
#   data_use:  test | demo | both
#   paths:     list of node-ID lists (each list = one path through the DAG)
#   demo_paths: (optional) subset of paths used in the GIF demo
# -----------------------------------------------------------------------------
stories:

  # =========================================================================
  # Step 1a: Account Configuration
  # =========================================================================
  - id: US-1a.1
    title: "Configure a single bank account with CSV import"
    section: "Step 1a: Account Configuration"
    status: null
    as_a: >-
      user with one bank account
    i_want: >-
      add my bank account (e.g. Triodos checking) to `config.yaml` with its CSV
      column mapping
    so_that: >-
      hledger-preprocessor knows how to parse my bank statement CSV file into
      transactions.
    acceptance_criteria:
      - >-
        `config.yaml` contains an entry under `accounts:` with `account_holder`,
        `bank`, `account_type`, `input_csv_filename`, and `csv_column_mapping`.
      - >-
        Running `hledger_preprocessor --config config.yaml --new-setup` successfully
        parses the CSV and creates the hledger-flow import directory structure
        (`import/{account_holder}/{bank}/{account_type}/{year}/`).
    label: "Single bank + CSV"
    colour: "#2196F3"
    pattern: solid
    data_use: both
    paths:
      - [cfg_1b1w, cat_basic, match_default, start_2024_1000eur]
    demo_paths:
      - [cfg_1b1w, cat_basic, match_default, start_2024_1000eur]
    component_filter:
      cfg_1b1w: [bank_csv, dir_paths, file_names, categorisation, matching_algo]
      cat_basic: [groceries]
      match_default: [days, amount_range, days_month_swap]
      start_2024_1000eur: [opening_balance, base_currency]

  - id: US-1a.2
    title: "Configure multiple bank accounts"
    section: "Step 1a: Account Configuration"
    status: null
    as_a: >-
      user with accounts at multiple banks (e.g. Triodos checking and ING savings)
    i_want: >-
