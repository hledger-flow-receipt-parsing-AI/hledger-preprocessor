  - id: US-3.12
    title: "Handle multiple transactions on the same account in one receipt"
    section: "Step 3: Receipt-to-CSV Transaction Matching"
    status: "WONTFIX"
    as_a: >-
      user who paid for part of a purchase with one card swipe and then a second
      card swipe on the same account (e.g. the first swipe failed and was retried
      for a different amount)
    i_want: >-
      know the correct workflow for this edge case
    so_that: >-
      both CSV debits are tracked without breaking the matching logic.
    acceptance_criteria:
      - >-
        The system raises a clear error if a receipt has two `AccountTransaction`
        entries referencing the same account, guiding the user to split the receipt
        into two labels.
      - >-
        Currently raises `NotImplementedError("Did not yet support multiple
        transactions on single account for a receipt.")`.
    resolution: >-
      This is intentionally not supported. The matching logic relies on the
      assumption that net amounts per account uniquely identify transactions.
      Allowing multiple transactions on the same account in a single receipt would
      break the category-to-account allocation logic.
    workaround: >-
      Duplicate/annotate the receipt photo and create two separate receipt labels,
      one for each card swipe amount. Each is then matched independently as its own
      receipt.
    no_dag_reason: >-
      WONTFIX — intentionally unsupported scenario; the workaround is to split
      into two separate receipts (each follows an existing DAG path).

