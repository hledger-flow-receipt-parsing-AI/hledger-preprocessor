  # =========================================================================
  # Cross-cutting Concerns
  # =========================================================================
  - id: US-X.1
    title: "Privacy: no data leaves my machine"
    section: "Cross-cutting Concerns"
    status: null
    as_a: >-
      privacy-conscious user
    i_want: >-
      all AI models (receipt OCR, transaction classification, receipt
      categorisation) to run entirely on my local machine
    so_that: >-
      my financial data, receipt images, and bank statements are never sent to any
      external service.
    acceptance_criteria:
      - >-
        No network calls are made during any pipeline step.
      - >-
        AI models are downloaded once and cached locally.
      - >-
        The tool works fully offline after initial model download.
    no_dag_reason: >-
      Cross-cutting constraint — applies to every pipeline step as a
      non-functional requirement; no distinct data-flow path of its own.

  - id: US-X.2
    title: "Reproducible pipeline output"
    section: "Cross-cutting Concerns"
    status: null
    as_a: >-
      user who wants to verify my bookkeeping
    i_want: >-
      running the full pipeline on the same inputs to always produce the exact same
      journal output
    so_that: >-
      I can audit and diff my financial records.
    acceptance_criteria:
      - >-
        The working directory is cleared at the start of each run.
      - >-
        Transaction hashes are deterministic.
      - >-
        Journal file content is identical across runs with the same input.
    no_dag_reason: >-
      Cross-cutting constraint — reproducibility property that applies to
      every pipeline run; verified by running US-4.1 twice and diffing output.

