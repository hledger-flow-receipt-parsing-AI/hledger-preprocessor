  - id: US-4.4
    title: "Optional incremental pipeline runs"
    section: "Step 4: Pipeline Execution"
    status: "NOT YET IMPLEMENTED"
    as_a: >-
      user who runs the pipeline monthly and would like the option to only
      re-process new bank statements
    i_want: >-
      the pipeline to support a `--only-compute-new-tnx` flag that skips
      already-processed CSVs
    so_that: >-
      the pipeline runs faster when I know nothing has changed.
    acceptance_criteria:
      - >-
        Without `--only-compute-new-tnx`, the pipeline recomputes all journals from
        scratch every run (existing behaviour, unchanged).
      - >-
        With `--only-compute-new-tnx`, the pipeline tracks processed file hashes and
        skips CSVs whose hash has not changed.
      - >-
        The journal output is identical whether run incrementally or from scratch.
      - >-
        If a hash mismatch is detected (file changed), the pipeline re-processes that
        file and warns the user.
    design_note: >-
      By default the pipeline always recomputes everything from scratch to verify
      integrity (this is the hledger principle). The incremental mode is opt-in
      only, and should use hash proofs to verify that skipped files are truly
      unchanged.
    no_dag_reason: >-
      Not yet implemented — optimisation flag; the data path is the same as
      US-4.1 but with caching/skip logic around unchanged files.

