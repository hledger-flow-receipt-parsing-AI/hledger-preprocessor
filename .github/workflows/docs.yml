name: Deploy User Story Docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte

      - name: Run tests
        run: python -m pytest

  gifs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciinema gifsicle ffmpeg plantuml

      - name: Install Python dependencies
        run: |
          pip install -e .
          pip install pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte agg

      - name: Generate GIFs
        env:
          SKIP_PREFLIGHT: '1'
        run: |
          ./build_userstories.sh --gifs-standalone --gifs-config --no-render

      - name: Upload GIF output
        uses: actions/upload-artifact@v4
        with:
          name: gifs
          path: gifs/*/output/
          retention-days: 1

  site:
    needs: gifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get install -y plantuml || true

      - name: Download GIF artifacts
        uses: actions/download-artifact@v4
        with:
          name: gifs
          path: gifs/

      - name: Generate site
        run: python user_stories/dag/generate_site.py --output site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
