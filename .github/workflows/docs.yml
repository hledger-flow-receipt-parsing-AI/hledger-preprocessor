name: Deploy User Story Docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI stubs
        run: |
          for target in \
            src/hledger_preprocessor/categorisation/rule_based/private_logic.py \
            src/hledger_preprocessor/checks/check_categorisation_overlap.py; do
            if [ ! -f "$target" ]; then
              cp "${target}.ci_stub" "$target"
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hledger

      - name: Install hledger-flow
        run: |
          curl -sL https://github.com/apauley/hledger-flow/releases/download/v0.16.2/hledger-flow-linux-x64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/hledger-flow

      - name: Install project and test dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Internal deps are sibling repos (not on PyPI). Install via
          # git+https: tokenless if public, or with a GH_PAT secret if private.
          auth=""; [ -n "${GH_PAT:-}" ] && auth="x-access-token:${GH_PAT}@"
          base="https://${auth}github.com/hledger-flow-receipt-parsing-AI"
          pip install \
            "git+${base}/hledger-core.git" \
            "git+${base}/hledger-config.git" \
            "git+${base}/hledger-csv-mapping.git" \
            "git+${base}/hledger-receipt-processing.git" \
            "git+${base}/hledger-rules.git" \
            "git+${base}/hledger-plot.git"
          pip install -e .
          pip install pytest pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte dash requests matplotlib \
                      opencv-python-headless kaleido==0.2.1

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/gpt4all_stub
        run: python -m pytest

  site:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get install -y plantuml || true

      # Demo videos are hosted as assets on the GitHub Release tagged
      # "site-media" (generated locally, uploaded there) — not built in CI.
      - name: Generate site
        run: |
          python user_stories/dag/generate_site.py --output site/ \
            --media-base-url "https://github.com/${{ github.repository }}/releases/download/site-media"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
