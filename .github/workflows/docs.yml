name: Deploy User Story Docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI stubs
        run: |
          for target in \
            src/hledger_preprocessor/categorisation/rule_based/private_logic.py \
            src/hledger_preprocessor/checks/check_categorisation_overlap.py; do
            if [ ! -f "$target" ]; then
              cp "${target}.ci_stub" "$target"
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hledger

      - name: Install hledger-flow
        run: |
          curl -sL https://github.com/apauley/hledger-flow/releases/download/v0.16.2/hledger-flow-linux-x64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/hledger-flow

      - name: Install project and test dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Internal deps are sibling repos (not on PyPI). Install via
          # git+https: tokenless if public, or with a GH_PAT secret if private.
          auth=""; [ -n "${GH_PAT:-}" ] && auth="x-access-token:${GH_PAT}@"
          base="https://${auth}github.com/hledger-flow-receipt-parsing-AI"
          pip install \
            "git+${base}/hledger-core.git" \
            "git+${base}/hledger-config.git" \
            "git+${base}/hledger-csv-mapping.git" \
            "git+${base}/hledger-receipt-processing.git" \
            "git+${base}/hledger-rules.git" \
            "git+${base}/hledger-plot.git"
          pip install -e .
          pip install pytest pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte dash requests matplotlib \
                      opencv-python-headless kaleido==0.2.1

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/gpt4all_stub
        run: python -m pytest

  gifs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI stubs
        run: |
          for target in \
            src/hledger_preprocessor/categorisation/rule_based/private_logic.py \
            src/hledger_preprocessor/checks/check_categorisation_overlap.py; do
            if [ ! -f "$target" ]; then
              cp "${target}.ci_stub" "$target"
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciinema gifsicle ffmpeg plantuml hledger

      - name: Install hledger-flow
        run: |
          curl -sL https://github.com/apauley/hledger-flow/releases/download/v0.16.2/hledger-flow-linux-x64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/hledger-flow

      - name: Install asciinema-agg (cast -> GIF renderer)
        run: |
          # The real renderer is the asciinema/agg binary, NOT the PyPI "agg".
          curl -sL https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu -o agg
          sudo install -m 0755 agg /usr/local/bin/asciinema-agg

      - name: Install Python dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          auth=""; [ -n "${GH_PAT:-}" ] && auth="x-access-token:${GH_PAT}@"
          base="https://${auth}github.com/hledger-flow-receipt-parsing-AI"
          pip install \
            "git+${base}/hledger-core.git" \
            "git+${base}/hledger-config.git" \
            "git+${base}/hledger-csv-mapping.git" \
            "git+${base}/hledger-receipt-processing.git" \
            "git+${base}/hledger-rules.git" \
            "git+${base}/hledger-plot.git"
          pip install -e .
          pip install pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte opencv-python-headless kaleido==0.2.1

      - name: Generate GIFs
        env:
          SKIP_PREFLIGHT: '1'
        run: |
          ./build_userstories.sh --gifs-standalone --gifs-config --no-render

      - name: Upload GIF output
        uses: actions/upload-artifact@v4
        with:
          name: gifs
          path: gifs/*/output/
          retention-days: 1

  site:
    needs: gifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get install -y plantuml || true

      - name: Download GIF artifacts
        uses: actions/download-artifact@v4
        with:
          name: gifs
          path: gifs/

      - name: Generate site
        run: python user_stories/dag/generate_site.py --output site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
