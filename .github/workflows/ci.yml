name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI stub for private_logic
        run: |
          target=src/hledger_preprocessor/categorisation/rule_based/private_logic.py
          if [ ! -f "$target" ]; then
            cp "${target}.ci_stub" "$target"
          fi

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte

      - name: Run tests
        run: python -m pytest
