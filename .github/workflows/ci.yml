name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI stub for private_logic
        run: |
          target=src/hledger_preprocessor/categorisation/rule_based/private_logic.py
          if [ ! -f "$target" ]; then
            cp "${target}.ci_stub" "$target"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hledger

      - name: Install hledger-flow
        run: |
          curl -sL https://github.com/apauley/hledger-flow/releases/download/v0.16.2/hledger-flow-linux-x64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/hledger-flow

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install "git+https://github.com/hledger-flow-receipt-parsing-AI/hledger-plot.git"
          pip install pytest pyyaml Pillow numpy chardet iso8601 \
                      python-dateutil urwid screeninfo plotly pandas \
                      pexpect pyte dash requests matplotlib

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/gpt4all_stub
        run: python -m pytest
