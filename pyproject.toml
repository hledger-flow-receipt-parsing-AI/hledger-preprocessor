[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledger-preprocessor"
version = "0.1.0"
description = "CLI pipeline orchestrator for hledger preprocessing"
requires-python = ">=3.10"
dependencies = [
    "hledger-core>=0.1.0",
    "hledger-config>=0.1.0",
    "hledger-csv-mapping>=0.1.0",
    "hledger-receipt-processing>=0.1.0",
    "hledger-rules>=0.1.0",
    "typeguard>=2.13.3",
    "pyyaml>=6.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
ai = ["hledger-ai>=0.1.0"]

[project.scripts]
hledger_preprocessor = "hledger_preprocessor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | build
  | dist
)/
'''


[tool.coverage.run]
# Due to a strange bug with xml output of coverage.py not writing the full-path
# of the sources, the full root directory is presented as a source alongside
# the main package. As a result any importable Python file/package needs to be
# included in the omit
source = [
    "foo",
    ".",
]
# Excludes the following directories from the coverage report
omit = [
    "tests/*",
    "setup.py",
]


[tool.isort]
profile = "black"


[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "hledger_preprocessor.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
allow_redefinition = true
disallow_any_generics = false

[tool.pylint.basic]
bad-names=[]
[tool.pylint.messages_control]
# Disable noisy checks that are not yet addressed across the codebase.
disable=[
    "import-error",
    "invalid-name",
    "fixme",
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    "import-outside-toplevel",
    "line-too-long",
    "redefined-outer-name",
    "wildcard-import",
    "unused-wildcard-import",
    "too-many-locals",
    "duplicate-code",
    "subprocess-run-check",
    "unspecified-encoding",
    "abstract-class-instantiated",
    "too-many-statements",
    "unused-argument",
    "no-member",
    "too-many-branches",
    "no-else-return",
    "too-many-arguments",
    "too-few-public-methods",
    "broad-exception-caught",
    "use-dict-literal",
    "consider-using-max-builtin",
    "unused-variable",
    "too-many-positional-arguments",
    "global-statement",
    "pointless-statement",
    "too-many-nested-blocks",
    "too-many-instance-attributes",
    "consider-using-with",
    "too-many-return-statements",
    "consider-using-f-string",
    "unnecessary-pass",
    "no-else-raise",
    "too-many-public-methods",
    "consider-using-in",
    "consider-using-enumerate",
    "unnecessary-comprehension",
    "use-a-generator",
    "too-many-boolean-expressions",
    "attribute-defined-outside-init",
    "unused-import",
    "arguments-renamed",
    "arguments-differ",
    "undefined-variable",
    "wrong-import-order",
    "ungrouped-imports",
    "unidiomatic-typecheck",
    "protected-access",
    "consider-using-sys-exit",
    "too-many-lines",
    "consider-using-dict-items",
    "inconsistent-return-statements",
    "use-implicit-booleaness-not-comparison",
    "expression-not-assigned",
    "used-before-assignment",
    "possibly-used-before-assignment",
    "raise-missing-from",
    "redundant-unittest-assert",
    "subprocess-popen-preexec-fn",
    "missing-timeout",
]


[tool.pytest.ini_options]
# Runs coverage.py through use of the pytest-cov plugin
# An xml report is generated and results are output to the terminal

# TODO: Disable this line to disable CLI coverage reports when running tests.
# addopts = "--cov --cov-report xml:cov.xml --cov-report term"

# Sets the minimum allowed pytest version
minversion = 5.0
# Sets the path where test files are located (Speeds up Test Discovery)
# GIF-generating tests live in test/gif/ and are excluded by default.
# Run them explicitly with: pytest test/gif/
testpaths = ["test/unit", "test/integration", "test/e2e", "test/scenarios"]
# Custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
